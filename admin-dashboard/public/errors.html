<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Molecule — Restaurant Error Logs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0b0f19;
      --surface: #111827;
      --surface-2: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #e50914;
      --primary-hover: #b80710;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.1);
      --warning: #f59e0b;
      --accent: #38bdf8;
      --radius: 12px;
      --font-mono: 'JetBrains Mono', monospace;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 1rem 1.5rem;
    }
    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .brand-section {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    .back-btn:hover {
      background: var(--border);
      color: #fff;
    }
    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .restaurant-badge {
      background: rgba(229, 9, 20, 0.15);
      border: 1px solid rgba(229, 9, 20, 0.35);
      color: #f87171;
      padding: 0.2rem 0.65rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      max-width: 320px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .date-input {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }
    .date-input:focus {
      border-color: var(--primary);
    }
    .date-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .date-btn:hover, .date-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    main {
      flex: 1;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Auth Banner */
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.5rem;
      max-width: 440px;
      margin: 4rem auto;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
    }
    .auth-card h2 { margin-bottom: 0.5rem; font-size: 1.4rem; }
    .auth-card p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1rem; text-align: left; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 500; margin-bottom: 0.35rem; color: var(--text-muted); }
    .form-group input {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      color: white;
      font-size: 0.9rem;
      outline: none;
    }
    .form-group input:focus { border-color: var(--primary); }
    .auth-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s;
    }
    .auth-btn:hover { background: var(--primary-hover); }
    .auth-error {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 0.6rem;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-top: 1rem;
      display: none;
    }

    /* Logs Container */
    .logs-container {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .empty-state {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 3.5rem 1.5rem;
      text-align: center;
      color: var(--text-muted);
    }
    .empty-icon {
      font-size: 2.5rem;
      margin-bottom: 0.75rem;
      display: block;
    }
    .empty-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.25rem;
    }

    /* Error Log Card */
    .log-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--danger);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: background 0.15s;
    }
    .log-item.source-renderer { border-left-color: var(--warning); }
    .log-item.source-ipc { border-left-color: var(--accent); }
    .log-item.source-process { border-left-color: #a855f7; }

    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .log-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .badge-source {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }
    .badge-source.renderer { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
    .badge-source.ipc { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
    .badge-source.process { background: rgba(168, 85, 247, 0.15); color: #c084fc; }

    .log-time {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
    .log-context {
      font-size: 0.75rem;
      background: var(--surface-2);
      color: var(--text-muted);
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      font-family: var(--font-mono);
      max-width: 500px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .log-message {
      font-size: 0.95rem;
      font-weight: 500;
      color: #f1f5f9;
      line-height: 1.4;
      word-break: break-word;
    }
    .stack-toggle {
      background: transparent;
      border: none;
      color: #38bdf8;
      font-size: 0.8rem;
      cursor: pointer;
      text-align: left;
      padding: 0;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .stack-toggle:hover { text-decoration: underline; }
    .stack-trace {
      background: #080c14;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 0.85rem;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: #94a3b8;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      margin-top: 0.35rem;
      display: none;
    }
    .stack-trace.show { display: block; }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { 
      getFirestore, 
      doc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: 'AIzaSyDEsgbZY1q50Y4NTmkbYrFmeB3_3-7v2Lw',
      authDomain: 'molecule-e2e95.firebaseapp.com',
      projectId: 'molecule-e2e95',
      storageBucket: 'molecule-e2e95.firebasestorage.app',
      messagingSenderId: '297835941121',
      appId: '1:297835941121:web:da4ca719e39fde27ad9f00',
      measurementId: 'G-XVD2WKKNEK',
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // State
    const urlParams = new URLSearchParams(window.location.search);
    let currentUid = urlParams.get('uid') || '';
    let currentRestaurantName = urlParams.get('name') || 'Restaurant';
    let selectedDate = getTodayString();
    let currentLogs = [];
    let unsubscribeErrors = null;

    function getTodayString() {
      return new Date().toISOString().split('T')[0];
    }
    function getYesterdayString() {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      return d.toISOString().split('T')[0];
    }

    // UI elements
    const authSection = document.getElementById('auth-section');
    const dashboardSection = document.getElementById('dashboard-section');
    const loginForm = document.getElementById('login-form');
    const authError = document.getElementById('auth-error');
    const btnLogout = document.getElementById('btn-logout');
    const logsContainer = document.getElementById('logs-container');
    const restaurantNameEl = document.getElementById('restaurant-name');
    const datePicker = document.getElementById('date-picker');
    const btnToday = document.getElementById('btn-today');
    const btnYesterday = document.getElementById('btn-yesterday');

    // Date init
    datePicker.value = selectedDate;

    // ── Master Admin Authorization Whitelist ──
    const AUTHORIZED_ADMIN_EMAILS = [
      'admin@moleculepos.com',
    ];

    function isAuthorizedAdmin(email) {
      if (!email) return false;
      const lower = email.toLowerCase().trim();
      if (AUTHORIZED_ADMIN_EMAILS.includes(lower)) return true;
      if (lower.endsWith('@moleculepos.com')) return true;
      return false;
    }

    // Auth state observer
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        if (!isAuthorizedAdmin(user.email)) {
          console.warn('Unauthorized access attempt by non-admin:', user.email);
          await signOut(auth);
          authSection.style.display = 'block';
          dashboardSection.style.display = 'none';
          btnLogout.style.display = 'none';
          authError.textContent = `Access Denied: ${user.email} is not a Master Admin.`;
          authError.style.display = 'block';
          return;
        }

        authSection.style.display = 'none';
        dashboardSection.style.display = 'flex';
        btnLogout.style.display = 'block';
        if (currentRestaurantName) {
          restaurantNameEl.textContent = currentRestaurantName;
        }
        listenToLogs();
      } else {
        if (unsubscribeErrors) unsubscribeErrors();
        authSection.style.display = 'block';
        dashboardSection.style.display = 'none';
        btnLogout.style.display = 'none';
      }
    });

    // Login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      authError.style.display = 'none';
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        authError.textContent = err.message || 'Login failed';
        authError.style.display = 'block';
      }
    });

    // Logout
    btnLogout.addEventListener('click', () => signOut(auth));

    // Date controls
    btnToday.addEventListener('click', () => {
      selectedDate = getTodayString();
      datePicker.value = selectedDate;
      btnToday.classList.add('active');
      btnYesterday.classList.remove('active');
      listenToLogs();
    });

    btnYesterday.addEventListener('click', () => {
      selectedDate = getYesterdayString();
      datePicker.value = selectedDate;
      btnYesterday.classList.add('active');
      btnToday.classList.remove('active');
      listenToLogs();
    });

    datePicker.addEventListener('change', (e) => {
      selectedDate = e.target.value;
      btnToday.classList.toggle('active', selectedDate === getTodayString());
      btnYesterday.classList.toggle('active', selectedDate === getYesterdayString());
      listenToLogs();
    });

    // Firestore listener for target restaurant
    function listenToLogs() {
      if (unsubscribeErrors) unsubscribeErrors();

      if (!currentUid) {
        logsContainer.innerHTML = `
          <div class="empty-state">
            <span class="empty-icon">🏢</span>
            <div class="empty-title">No Restaurant Specified</div>
            <p>Please navigate here by clicking "Error Logs" on a restaurant card in the Master Admin Dashboard.</p>
          </div>
        `;
        return;
      }

      logsContainer.innerHTML = `
        <div class="empty-state">
          <div class="empty-title">Loading Logs...</div>
          <p>Connecting to diagnostic log stream for ${escapeHtml(currentRestaurantName)}...</p>
        </div>
      `;

      // Path: restaurants/{currentUid}/error_logs/{selectedDate}
      const logDocRef = doc(db, 'restaurants', currentUid, 'error_logs', selectedDate);
      
      unsubscribeErrors = onSnapshot(logDocRef, (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          // Support both 'errors' (standard from error-logger) and 'logs'
          const rawList = (data && (data.errors || data.logs)) || [];
          currentLogs = rawList.slice().reverse(); // Show latest first
        } else {
          currentLogs = [];
        }
        renderLogs();
      }, (err) => {
        console.error("Error reading error logs:", err);
        logsContainer.innerHTML = `
          <div class="empty-state">
            <span class="empty-icon">⚠️</span>
            <div class="empty-title">Failed to Load Logs</div>
            <p>${err.message || 'Permission denied or network failure.'}</p>
          </div>
        `;
      });
    }

    function renderLogs() {
      if (currentLogs.length === 0) {
        logsContainer.innerHTML = `
          <div class="empty-state">
            <span class="empty-icon">✨</span>
            <div class="empty-title">No Errors Found</div>
            <p>Zero error logs recorded on ${selectedDate} for this restaurant.</p>
          </div>
        `;
        return;
      }

      logsContainer.innerHTML = currentLogs.map((log, index) => {
        const src = (log.source || 'main').toLowerCase();
        let dateStr = 'Unknown';
        if (log.timestamp) {
          try {
            const d = new Date(log.timestamp);
            dateStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' ' + d.toLocaleDateString();
          } catch {
            dateStr = String(log.timestamp);
          }
        }
        const hasStack = Boolean(log.stack && log.stack.trim());
        const stackId = `stack-${index}`;
        let ctxStr = '';
        if (log.context) {
          try {
            ctxStr = typeof log.context === 'string' ? log.context : JSON.stringify(log.context);
          } catch {
            ctxStr = '';
          }
        }

        return `
          <div class="log-item source-${src}">
            <div class="log-header">
              <div class="log-meta">
                <span class="badge-source ${src}">${escapeHtml(log.source || 'MAIN')}</span>
                <span class="log-time">${escapeHtml(dateStr)}</span>
                ${ctxStr ? `<span class="log-context" title="${escapeHtml(ctxStr)}">${escapeHtml(ctxStr)}</span>` : ''}
              </div>
            </div>
            <div class="log-message">${escapeHtml(log.message || 'Unknown error occurred')}</div>
            ${hasStack ? `
              <div>
                <button class="stack-toggle" onclick="toggleStack('${stackId}')">
                  ▶ View Stack Trace
                </button>
                <div class="stack-trace" id="${stackId}">${escapeHtml(log.stack)}</div>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    window.toggleStack = function(id) {
      const el = document.getElementById(id);
      if (el) {
        el.classList.toggle('show');
        const btn = el.previousElementSibling;
        if (btn) {
          btn.textContent = el.classList.contains('show') ? '▼ Hide Stack Trace' : '▶ View Stack Trace';
        }
      }
    };

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand-section">
        <a href="index.html" class="back-btn">
          ← Back to All Restaurants
        </a>
        <div class="brand-title">
          Error Logs:
          <span class="restaurant-badge" id="restaurant-name">Loading...</span>
        </div>
      </div>
      <div class="header-controls">
        <button class="date-btn active" id="btn-today">Today</button>
        <button class="date-btn" id="btn-yesterday">Yesterday</button>
        <input type="date" class="date-input" id="date-picker" />
        <button id="btn-logout" class="date-btn" style="display: none;">Logout</button>
      </div>
    </div>
  </header>

  <!-- Login Form -->
  <div id="auth-section" class="auth-card" style="display: none;">
    <h2>Admin Sign In</h2>
    <p>Sign in with your master admin credentials to view restaurant error logs</p>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Admin Email</label>
        <input type="email" id="email" required placeholder="admin@moleculepos.com" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••" />
      </div>
      <button type="submit" class="auth-btn">Sign In</button>
      <div id="auth-error" class="auth-error"></div>
    </form>
  </div>

  <!-- Dashboard Main Content -->
  <main id="dashboard-section" style="display: none;">
    <!-- Error Logs List -->
    <div class="logs-container" id="logs-container">
      <div class="empty-state">
        <div class="empty-title">Loading Logs...</div>
        <p>Connecting to diagnostic log stream...</p>
      </div>
    </div>
  </main>
</body>
</html>
