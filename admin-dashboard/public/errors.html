<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Molecule — Restaurant Error Logs</title>
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Inter is only a fallback for non-Apple platforms; Apple devices use SF Pro via the system font stack. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/liquid-glass.css?v=1" />
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { 
      getFirestore, 
      doc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: 'AIzaSyDEsgbZY1q50Y4NTmkbYrFmeB3_3-7v2Lw',
      authDomain: 'molecule-e2e95.firebaseapp.com',
      projectId: 'molecule-e2e95',
      storageBucket: 'molecule-e2e95.firebasestorage.app',
      messagingSenderId: '297835941121',
      appId: '1:297835941121:web:da4ca719e39fde27ad9f00',
      measurementId: 'G-XVD2WKKNEK',
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // State
    const urlParams = new URLSearchParams(window.location.search);
    let currentUid = urlParams.get('uid') || '';
    let currentRestaurantName = urlParams.get('name') || 'Restaurant';
    let selectedDate = getTodayString();
    let currentLogs = [];
    let unsubscribeErrors = null;

    function getTodayString() {
      return new Date().toISOString().split('T')[0];
    }
    function getYesterdayString() {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      return d.toISOString().split('T')[0];
    }

    // UI elements
    const authSection = document.getElementById('auth-section');
    const dashboardSection = document.getElementById('dashboard-section');
    const loginForm = document.getElementById('login-form');
    const authError = document.getElementById('auth-error');
    const btnLogout = document.getElementById('btn-logout');
    const logsContainer = document.getElementById('logs-container');
    const restaurantNameEl = document.getElementById('restaurant-name');
    const datePicker = document.getElementById('date-picker');
    const btnToday = document.getElementById('btn-today');
    const btnYesterday = document.getElementById('btn-yesterday');

    // Date init
    datePicker.value = selectedDate;

    // ── Master Admin Authorization Whitelist ──
    const AUTHORIZED_ADMIN_EMAILS = [
      'admin@moleculepos.com',
    ];

    function isAuthorizedAdmin(email) {
      if (!email) return false;
      const lower = email.toLowerCase().trim();
      if (AUTHORIZED_ADMIN_EMAILS.includes(lower)) return true;
      if (lower.endsWith('@moleculepos.com')) return true;
      return false;
    }

    // Auth state observer
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        if (!isAuthorizedAdmin(user.email)) {
          console.warn('Unauthorized access attempt by non-admin:', user.email);
          await signOut(auth);
          authSection.style.display = 'block';
          dashboardSection.style.display = 'none';
          btnLogout.style.display = 'none';
          authError.textContent = `Access Denied: ${user.email} is not a Master Admin.`;
          authError.style.display = 'block';
          return;
        }

        authSection.style.display = 'none';
        dashboardSection.style.display = 'flex';
        btnLogout.style.display = 'block';
        if (currentRestaurantName) {
          restaurantNameEl.textContent = currentRestaurantName;
        }
        listenToLogs();
      } else {
        if (unsubscribeErrors) unsubscribeErrors();
        authSection.style.display = 'block';
        dashboardSection.style.display = 'none';
        btnLogout.style.display = 'none';
      }
    });

    // Login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      authError.style.display = 'none';
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        authError.textContent = err.message || 'Login failed';
        authError.style.display = 'block';
      }
    });

    // Logout
    btnLogout.addEventListener('click', () => signOut(auth));

    // Date controls
    btnToday.addEventListener('click', () => {
      selectedDate = getTodayString();
      datePicker.value = selectedDate;
      btnToday.classList.add('active');
      btnYesterday.classList.remove('active');
      listenToLogs();
    });

    btnYesterday.addEventListener('click', () => {
      selectedDate = getYesterdayString();
      datePicker.value = selectedDate;
      btnYesterday.classList.add('active');
      btnToday.classList.remove('active');
      listenToLogs();
    });

    datePicker.addEventListener('change', (e) => {
      selectedDate = e.target.value;
      btnToday.classList.toggle('active', selectedDate === getTodayString());
      btnYesterday.classList.toggle('active', selectedDate === getYesterdayString());
      listenToLogs();
    });

    // Firestore listener for target restaurant
    function listenToLogs() {
      if (unsubscribeErrors) unsubscribeErrors();

      if (!currentUid) {
        logsContainer.innerHTML = `
          <div class="empty-state">
            <span class="empty-icon">🏢</span>
            <div class="empty-title">No Restaurant Specified</div>
            <p>Please navigate here by clicking "Error Logs" on a restaurant card in the Master Admin Dashboard.</p>
          </div>
        `;
        return;
      }

      logsContainer.innerHTML = `
        <div class="empty-state">
          <div class="empty-title">Loading Logs...</div>
          <p>Connecting to diagnostic log stream for ${escapeHtml(currentRestaurantName)}...</p>
        </div>
      `;

      // Path: restaurants/{currentUid}/error_logs/{selectedDate}
      const logDocRef = doc(db, 'restaurants', currentUid, 'error_logs', selectedDate);
      
      unsubscribeErrors = onSnapshot(logDocRef, (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          // Support both 'errors' (standard from error-logger) and 'logs'
          const rawList = (data && (data.errors || data.logs)) || [];
          currentLogs = rawList.slice().reverse(); // Show latest first
        } else {
          currentLogs = [];
        }
        renderLogs();
      }, (err) => {
        console.error("Error reading error logs:", err);
        logsContainer.innerHTML = `
          <div class="empty-state">
            <span class="empty-icon">⚠️</span>
            <div class="empty-title">Failed to Load Logs</div>
            <p>${err.message || 'Permission denied or network failure.'}</p>
          </div>
        `;
      });
    }

    function renderLogs() {
      if (currentLogs.length === 0) {
        logsContainer.innerHTML = `
          <div class="empty-state">
            <span class="empty-icon">✨</span>
            <div class="empty-title">No Errors Found</div>
            <p>Zero error logs recorded on ${selectedDate} for this restaurant.</p>
          </div>
        `;
        return;
      }

      logsContainer.innerHTML = currentLogs.map((log, index) => {
        const src = (log.source || 'main').toLowerCase();
        let dateStr = 'Unknown';
        if (log.timestamp) {
          try {
            const d = new Date(log.timestamp);
            dateStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' ' + d.toLocaleDateString();
          } catch {
            dateStr = String(log.timestamp);
          }
        }
        const hasStack = Boolean(log.stack && log.stack.trim());
        const stackId = `stack-${index}`;
        let ctxStr = '';
        if (log.context) {
          try {
            ctxStr = typeof log.context === 'string' ? log.context : JSON.stringify(log.context);
          } catch {
            ctxStr = '';
          }
        }

        return `
          <div class="log-item source-${src}">
            <div class="log-header">
              <div class="log-meta">
                <span class="badge-source ${src}">${escapeHtml(log.source || 'MAIN')}</span>
                <span class="log-time">${escapeHtml(dateStr)}</span>
                ${ctxStr ? `<span class="log-context" title="${escapeHtml(ctxStr)}">${escapeHtml(ctxStr)}</span>` : ''}
              </div>
            </div>
            <div class="log-message">${escapeHtml(log.message || 'Unknown error occurred')}</div>
            ${hasStack ? `
              <div>
                <button class="stack-toggle" onclick="toggleStack('${stackId}')">
                  ▶ View Stack Trace
                </button>
                <div class="stack-trace" id="${stackId}">${escapeHtml(log.stack)}</div>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    window.toggleStack = function(id) {
      const el = document.getElementById(id);
      if (el) {
        el.classList.toggle('show');
        const btn = el.previousElementSibling;
        if (btn) {
          btn.textContent = el.classList.contains('show') ? '▼ Hide Stack Trace' : '▶ View Stack Trace';
        }
      }
    };

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</head>
<body class="lg page-errors">
  <div class="lg-backdrop" aria-hidden="true"></div>

  <header class="navbar">
    <div class="navbar-inner header-inner">
      <div class="brand-section">
        <a href="index.html" class="back-btn btn btn-glass">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15 19l-7-7 7-7"/></svg>
          <span>All Restaurants</span>
        </a>
        <h1 class="brand-title">
          Error Logs
          <span class="restaurant-badge" id="restaurant-name">Loading...</span>
        </h1>
      </div>
      <div class="header-controls">
        <div class="segmented" role="group" aria-label="Quick date">
          <button class="date-btn active" id="btn-today">Today</button>
          <button class="date-btn" id="btn-yesterday">Yesterday</button>
        </div>
        <label for="date-picker" class="sr-only">Log date</label>
        <input type="date" class="date-input" id="date-picker" />
        <button id="btn-logout" class="date-btn logout-btn btn btn-glass" style="display: none;">Logout</button>
      </div>
    </div>
  </header>

  <!-- Login Form -->
  <div id="auth-section" class="auth-card auth-panel glass sheen" style="display: none;">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h2 class="auth-title">Admin Sign In</h2>
    <p class="auth-sub">Sign in with your master admin credentials to view restaurant error logs</p>
    <form id="login-form" class="auth-form">
      <div class="form-group">
        <label for="email">Admin Email</label>
        <input type="email" id="email" class="field" required autocomplete="username" placeholder="admin@moleculepos.com" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="field" required autocomplete="current-password" placeholder="••••••••" />
      </div>
      <button type="submit" class="auth-btn btn btn-primary btn-lg btn-block">Sign In</button>
      <div id="auth-error" class="auth-error alert" role="alert"></div>
    </form>
  </div>

  <!-- Dashboard Main Content -->
  <main id="dashboard-section" class="page" style="display: none;">
    <!-- Error Logs List -->
    <div class="logs-container" id="logs-container" aria-live="polite">
      <div class="empty-state">
        <div class="empty-title">Loading Logs...</div>
        <p>Connecting to diagnostic log stream...</p>
      </div>
    </div>
  </main>
</body>
</html>
