<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ws: wss: http: https:;" />
    <title>Molecule</title>
    <script>
      (function() {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || t === 'black') {
          document.documentElement.classList.add('dark');
          if (t === 'black') {
            document.documentElement.classList.add('theme-black');
          } else {
            document.documentElement.classList.add('theme-dark');
          }
        }
      })();
    </script>
  </head>
  <body class="bg-gray-100 text-gray-900 antialiased">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
