name: Molecule Admin Dashboard Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'admin-dashboard/**'
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Deploy Admin Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MOLECULE_E2E95 }}
          channelId: live
          projectId: molecule-e2e95
          entryPoint: admin-dashboard
          target: molecule-admin
